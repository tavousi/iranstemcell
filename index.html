<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد ارزیابی سند ملی علوم و فناوری‌های سلول‌های بنیادی</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --primary:#2563eb; --primary-dark:#1e40af;
  --green-dark:#15803d; --green-light:#22c55e;
  --yellow:#eab308; --orange:#f97316; --red:#dc2626;
  --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
@font-face{font-family:'Sahel';src:url('./Sahel-VF.woff2') format('woff2'),url('./Sahel.woff') format('woff'),url('./Sahel.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap}
body{font-family:'Sahel',Tahoma,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:1400px;margin:0 auto;padding:20px}
header{background:linear-gradient(135deg,#173f63,#2563eb);color:#fff;padding:18px 24px;border-radius:12px;margin-bottom:20px;box-shadow:var(--shadow-lg)}
.brand-header{display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand-identity{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    
    width: 90px;
    height: 90px;
    
    flex-shrink: 0;
    overflow: hidden;
}

.brand-mark img {
    width: 100%;
    height: 100%;
    
    object-fit: contain;
    display: block;
}
.brand-logos{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand-org{font-size:.86rem;opacity:.92;margin-bottom:3px}
.brand-unit{font-size:.8rem;opacity:.82}
.brand-title{font-size:1.55rem;margin:8px 0 4px}
.brand-subtitle{opacity:.9;font-size:.92rem}
.brand-credit{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.18);font-size:.78rem;opacity:.86}
@media(max-width:768px){.brand-header{align-items:flex-start}.brand-mark{width:52px;height:52px;flex-basis:52px;font-size:.7rem}.brand-title{font-size:1.15rem}}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;background:#fff;padding:10px;border-radius:10px;box-shadow:var(--shadow)}
nav.tabs button{padding:10px 18px;border:none;background:transparent;cursor:pointer;border-radius:8px;font-family:inherit;font-size:.95rem;color:var(--muted);transition:all .2s}
nav.tabs button:hover{background:#f3f4f6}
nav.tabs button.active{background:var(--primary);color:#fff}
.card{background:var(--card);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.card h2{font-size:1.2rem;margin-bottom:15px;color:var(--primary-dark);border-bottom:2px solid var(--border);padding-bottom:8px}
.card h3{font-size:1.05rem;margin:12px 0 8px;color:#374151}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}
.stat-box{background:#fff;padding:18px;border-radius:10px;box-shadow:var(--shadow);border-right:4px solid var(--primary)}
.stat-box .label{font-size:.85rem;color:var(--muted);margin-bottom:5px}
.stat-box .value{font-size:1.6rem;font-weight:bold;color:var(--text)}
.stat-box.green-dark{border-right-color:var(--green-dark)}
.stat-box.green-light{border-right-color:var(--green-light)}
.stat-box.yellow{border-right-color:var(--yellow)}
.stat-box.orange{border-right-color:var(--orange)}
.stat-box.red{border-right-color:var(--red)}
.bar-row{display:flex;align-items:center;margin:10px 0;gap:12px}
.bar-label{min-width:260px;font-size:.9rem}
.bar-track{flex:1;height:28px;background:#e5e7eb;border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;color:#fff;font-size:.85rem;font-weight:bold;transition:width .6s}
.bar-value{min-width:50px;text-align:left;font-weight:bold;font-size:.95rem}
.goal-bar{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.strategy-card{border:1px solid var(--border);border-radius:10px;padding:15px;margin-bottom:12px;cursor:pointer;transition:all .2s}
.strategy-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.strategy-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.strategy-title{font-weight:bold;font-size:1rem}
.strategy-stats{display:flex;gap:15px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:10px}
.strategy-stats span{display:flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.green-dark{background:var(--green-dark)}
.dot.green-light{background:var(--green-light)}
.dot.yellow{background:var(--yellow)}
.dot.orange{background:var(--orange)}
.dot.red{background:var(--red)}
.action-item{padding:10px 12px;border-radius:6px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem;border:1px solid var(--border)}
.action-item.green-dark{background:#dcfce7;border-color:#15803d}
.action-item.green-light{background:#bbf7d0;border-color:#22c55e}
.action-item.yellow{background:#fef9c3;border-color:#eab308}
.action-item.orange{background:#ffedd5;border-color:#f97316}
.action-item.red{background:#fee2e2;border-color:#dc2626}
.action-title{flex:1;font-weight:500}
.action-badge{padding:3px 10px;border-radius:12px;font-size:.75rem;color:#fff;white-space:nowrap}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.9rem;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#e5e7eb;color:var(--text)}
.btn-secondary:hover{background:#d1d5db}
.btn-danger{background:var(--red);color:#fff}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.filters input,.filters select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:.9rem}
.filters input{flex:1;min-width:200px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-content{background:#fff;border-radius:12px;padding:25px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto}
.modal-content h2{margin-bottom:15px;color:var(--primary-dark)}
.modal-brand{font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:5px;font-weight:bold;font-size:.9rem}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:.9rem}
.form-group textarea{min-height:80px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.close-btn{float:left;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--muted)}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin:15px 0;font-size:.85rem}
.legend-item{display:flex;align-items:center;gap:6px}
.hidden{display:none}
.chart-container{position:relative;height:300px;margin:15px 0}
table{width:100%;border-collapse:collapse;margin-top:10px}
table th,table td{padding:10px;text-align:right;border-bottom:1px solid var(--border);font-size:.9rem}
table th{background:#f9fafb;font-weight:bold}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75rem;color:#fff}
@media(max-width:768px){
  .bar-label{min-width:150px;font-size:.8rem}
  .form-row{grid-template-columns:1fr}
  header h1{font-size:1.3rem}
  nav.tabs button{padding:8px 12px;font-size:.85rem}
}
@media print{body{background:#fff}.container{max-width:none;padding:0}header{border-radius:0;box-shadow:none}.tabs,.btn,.filters{display:none!important}.card{box-shadow:none;border:1px solid #ddd}.modal{display:none!important}}

/* ===== امکانات ویرایش و ذخیره ===== */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .btn{white-space:nowrap}
.editor-list{display:grid;gap:12px}
.editor-card{border:1px solid var(--border);border-radius:10px;padding:15px;background:#fff}
.editor-card .editor-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.editor-card .editor-actions{display:flex;gap:6px;flex-wrap:wrap}
.editor-card .meta-line{font-size:.82rem;color:var(--muted);margin-top:6px}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-success{background:#15803d;color:#fff}
.btn-warning{background:#b45309;color:#fff}
.small-help{font-size:.8rem;color:var(--muted);margin-top:7px}
.sync-banner{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:8px;padding:10px 12px;margin-bottom:15px;font-size:.85rem}
.danger-zone{margin:24px 0 10px;padding:14px 16px;border:1px dashed var(--red);border-radius:10px;background:#fef2f2;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.85rem;color:#7f1d1d}
.readonly-field{background:#f9fafb}
.program-strategy{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.program-strategy > .program-head{padding:12px 15px;background:#f9fafb;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.program-actions{padding:8px 15px 12px}
.empty-state{padding:25px;text-align:center;color:var(--muted)}


/* ===== تب سیری در سند: نمایش اینفوگرافی به‌صورت تصویر ===== */
.document-viewer-card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:20px}
.document-viewer-toolbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.document-viewer-toolbar .btn{min-width:44px}
.document-zoom-info{min-width:78px;text-align:center;font-weight:bold;color:var(--primary-dark)}
.document-help-tip{position:absolute;top:10px;right:10px;left:10px;z-index:5;background:rgba(15,23,42,.88);color:#fff;font-size:.78rem;line-height:1.9;text-align:center;padding:8px 12px;border-radius:8px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.document-help-tip small{opacity:.75}
.document-canvas-wrap{position:relative;width:100%;height:calc(100vh - 170px);height:calc(100dvh - 170px);min-height:520px;max-height:1000px;overflow:hidden;background:#dbe7f2;border:1px solid var(--border);border-radius:10px;cursor:grab;touch-action:none}
.document-viewer-card:fullscreen{background:#0f172a;border:none;border-radius:0;max-width:none;margin:0;padding:12px;overflow:auto}
.document-viewer-card:fullscreen .document-canvas-wrap{height:calc(100vh - 130px);height:calc(100dvh - 130px);max-height:none}
.document-viewer-card:fullscreen .document-help{color:#cbd5e1;background:transparent;border-color:#334155}
.document-canvas-wrap.dragging{cursor:grabbing}
#documentImage{position:absolute;top:0;left:0;max-width:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;transform-origin:0 0;box-shadow:0 5px 20px rgba(0,0,0,.18);background:#fff}
.document-help{margin-top:10px;padding:10px 12px;border-radius:8px;background:#f8fafc;border:1px solid var(--border);color:var(--muted);font-size:.82rem;text-align:center}
.document-error{padding:30px;text-align:center;color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:8px}
@media(max-width:768px){.document-canvas-wrap{height:calc(100vh - 150px);height:calc(100dvh - 150px);min-height:420px}}

</style>
</head>

<!-- داده‌های داشبورد از فایل بیرونی data.json بارگذاری می‌شوند. -->
<script>
/* داده‌ها به‌صورت JSON داخل همین فایل HTML نگهداری می‌شوند و LocalStorage استفاده نمی‌شود. */
let DATA = null;
async function loadDataFile(){
  const res=await fetch('./data.json',{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}
let currentTab = "overview";
let charts = {};
if(typeof Chart!=='undefined'){Chart.defaults.font.family="'Sahel',Tahoma,'Segoe UI',Arial,sans-serif";Chart.defaults.font.size=12;}

const STATUS_RULES = [
  {key:"completed", label:"تکمیل‌شده", color:"green-dark", min:90.0000001, score:100},
  {key:"achieved", label:"دستاورد عینی", color:"green-light", min:70, maxInclusive:90, score:75},
  {key:"initial_output", label:"خروجی اولیه", color:"yellow", min:50, maxExclusive:70, score:50},
  {key:"initial", label:"فعالیت اولیه", color:"orange", min:10, maxExclusive:50, score:25},
  {key:"neglected", label:"مغفول", color:"red", min:-Infinity, maxExclusive:10, score:0}
];
const STATUS_BY_KEY = Object.fromEntries(STATUS_RULES.map(x=>[x.key,x]));

function esc(value){
  return String(value ?? "").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
}
function clampPercent(v){
  const n=Number(v);
  if(!Number.isFinite(n)) return 0;
  return Math.max(0,Math.min(100,n));
}
function classifyAchievement(v){
  const n=clampPercent(v);
  if(n>90) return "completed";
  if(n>=70) return "achieved";
  if(n>=50) return "initial_output";
  if(n>=10) return "initial";
  return "neglected";
}
function syncActionStatus(a){
  a.achievement=clampPercent(a.achievement);
  a.status=classifyAchievement(a.achievement);
  return a.status;
}
function syncAllStatuses(){ DATA.actions.forEach(syncActionStatus); }
function nextId(arr){ return arr.length ? Math.max(...arr.map(x=>Number(x.id)||0))+1 : 1; }
function getStrategy(id){ return DATA.strategies.find(x=>x.id===Number(id)); }
function getAction(id){ return DATA.actions.find(x=>x.id===Number(id)); }
function getChallenge(id){ return DATA.challenges.find(x=>x.id===Number(id)); }
function getStrategyActions(sid){ return DATA.actions.filter(a=>a.strategyId===Number(sid)); }
function statusPercent(status){ return STATUS_BY_KEY[status]?.score ?? 0; }
function calcStrategyScore(sid){
  const acts=getStrategyActions(sid); if(!acts.length) return 0;
  const total=acts.reduce((s,a)=>s+statusPercent(syncActionStatus(a))*(Number(a.weight)||1),0);
  const totalW=acts.reduce((s,a)=>s+(Number(a.weight)||1),0);
  return totalW?total/totalW:0;
}
function statusCount(){
  const c={completed:0,achieved:0,initial_output:0,initial:0,neglected:0};
  DATA.actions.forEach(a=>c[syncActionStatus(a)]++);
  return c;
}
function isMeasurableGoal(goal){return goal.isMeasurable!==false && Number.isFinite(Number(goal.achievement));}
function calcOverallGoals(){
  const measurable=DATA.goals.filter(isMeasurableGoal);
  const totalW=measurable.reduce((s,g)=>s+(Number(g.weight)||0),0);
  const total=measurable.reduce((s,g)=>s+Number(g.achievement)*(Number(g.weight)||0),0);
  return totalW?(total/totalW).toFixed(1):"—";
}

/* ذخیره‌سازی از طریق «پشتیبان JSON» انجام می‌شود؛ داده‌ها در فایل بیرونی data.json نگه‌داری می‌شوند. */
async function restoreEmbedded(){
  if(!confirm('همه تغییرات فعلی حذف و داده‌ها از فایل data.json دوباره بارگذاری شود؟'))return;
  try{
    DATA=await loadDataFile(); syncAllStatuses(); render();
  }catch(err){ console.error(err); alert('بارگذاری data.json ناموفق بود. مطمئن شوید فایل data.json کنار index.html قرار دارد.'); }
}
function markUnsaved(){
  const el=document.getElementById('saveState');
  if(el) el.textContent='● تغییرات ذخیره‌نشده — برای نگه‌داشتن آن‌ها «پشتیبان JSON» بگیرید.';
}
function markSaved(){
  const el=document.getElementById('saveState');
  if(el) el.textContent='✓ داده‌ها در حافظهٔ همین صفحه به‌روز هستند؛ برای ماندگاری، «پشتیبان JSON» بگیرید.';
}

function renderToolbar(){
 return `<div class="toolbar">
   <button class="btn btn-success" onclick="downloadBackupJson()">⬇️ پشتیبان JSON</button>
   <span id="saveState" class="small-help">✓ داده‌ها از فایل data.json بارگذاری شده‌اند.</span>
 </div>`;
}
function downloadBackupJson(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='stemcell_dashboard_data.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function render(){
  syncAllStatuses(); destroyCharts();
  const app=document.getElementById('app');
  app.innerHTML=(currentTab==='document'?'':renderToolbar()) + (
    currentTab==='document'?renderDocument():
    currentTab==='overview'?renderOverview():
    currentTab==='goals'?renderGoals():
    currentTab==='strategies'?renderStrategies():
    currentTab==='program'?renderProgram():
    currentTab==='actions'?renderActions():renderReports());
  const dz=document.querySelector('.danger-zone');
  if(dz)dz.style.display=currentTab==='document'?'none':'';
  attachEvents();
  if(currentTab==='document') initDocumentViewer();
  if(currentTab==='overview') drawOverviewCharts();
  if(currentTab==='goals') drawGoalsChart();
  if(currentTab==='strategies') renderTreemap();
  if(currentTab==='reports') drawReportsCharts();
  markSaved();
}

function renderDocument(){
  return `<div class="document-viewer-card">
      <div class="document-viewer-toolbar">
        <button class="btn btn-secondary" onclick="documentZoomOut()" title="کوچک‌نمایی">−</button>
        <button class="btn btn-primary" onclick="documentZoomReset()" title="بازنشانی">بازنشانی</button>
        <button class="btn btn-secondary" onclick="documentZoomIn()" title="بزرگ‌نمایی">+</button>

/* ===== کنترل تعاملی اینفوگرافی ===== */
let documentViewerReady=false;
let documentImageNaturalWidth=0;
let documentImageNaturalHeight=0;
let documentScale=1;
let documentMinScale=0.5;
let documentMaxScale=6;
let documentPanX=0;
let documentPanY=0;
let documentPointerId=null;
let documentDragging=false;
let documentDownX=0;
let documentDownY=0;
let documentStartPanX=0;
let documentStartPanY=0;
let documentMoved=false;
let documentLastTouchDistance=null;
let documentLastTouchCenter=null;

function initDocumentViewer(){
  const wrap=document.getElementById('documentViewer');
  const img=document.getElementById('documentImage');
  if(!wrap || !img) return;
  const setup=()=>{
    documentImageNaturalWidth=img.naturalWidth;
    documentImageNaturalHeight=img.naturalHeight;
    if(!documentImageNaturalWidth || !documentImageNaturalHeight){ showDocumentError(); return; }
    documentFitToScreen();
    if(!documentViewerReady){ setupDocumentInteractions(wrap); documentViewerReady=true; }
  };
  if(img.complete) setup(); else img.onload=setup;
  img.onerror=showDocumentError;
}
function showDocumentError(){
  const wrap=document.getElementById('documentViewer');
  if(wrap) wrap.innerHTML='<div class="document-error"><b>خطا در بارگذاری اینفوگرافی</b><br><br>مطمئن شوید فایل <b>119401.jpg</b> دقیقاً در همان پوشه‌ای قرار دارد که فایل HTML قرار دارد.</div>';
}
function getDocumentBaseSize(){
  const wrap=document.getElementById('documentViewer');
  if(!wrap || !documentImageNaturalWidth) return 1;
  const pad=24;
  return Math.min((wrap.clientWidth-pad)/documentImageNaturalWidth,(wrap.clientHeight-pad)/documentImageNaturalHeight);
}
function updateDocumentTransform(){
  const img=document.getElementById('documentImage');
  if(!img) return;
  const base=getDocumentBaseSize();
  img.style.width=(documentImageNaturalWidth*base)+'px';
  img.style.height=(documentImageNaturalHeight*base)+'px';
  img.style.transform=`translate(${documentPanX}px,${documentPanY}px) scale(${documentScale})`;
  const info=document.getElementById('documentZoomInfo');
  if(info) info.textContent=Math.round(documentScale*100)+'%';
}
function documentFitToScreen(){
  const wrap=document.getElementById('documentViewer');
  if(!wrap || !documentImageNaturalWidth) return;
  documentScale=1;
  const base=getDocumentBaseSize();
  const w=documentImageNaturalWidth*base, h=documentImageNaturalHeight*base;
  documentPanX=(wrap.clientWidth-w)/2; documentPanY=(wrap.clientHeight-h)/2;
  updateDocumentTransform();
}
function documentZoomAt(newScale,clientX,clientY){
  const wrap=document.getElementById('documentViewer'); if(!wrap) return;
  const oldScale=documentScale;
  documentScale=Math.max(documentMinScale,Math.min(documentMaxScale,newScale));
  const rect=wrap.getBoundingClientRect();
  const x=clientX-rect.left, y=clientY-rect.top, ratio=documentScale/oldScale;
  documentPanX=x-(x-documentPanX)*ratio; documentPanY=y-(y-documentPanY)*ratio;
  updateDocumentTransform();
}
function documentZoomIn(){
  const wrap=document.getElementById('documentViewer'); if(!wrap) return;
  const r=wrap.getBoundingClientRect(); documentZoomAt(documentScale*1.25,r.left+r.width/2,r.top+r.height/2);
}
function documentZoomOut(){
  const wrap=document.getElementById('documentViewer'); if(!wrap) return;
  const r=wrap.getBoundingClientRect(); documentZoomAt(documentScale/1.25,r.left+r.width/2,r.top+r.height/2);
}
function documentZoomReset(){documentFitToScreen();}
function documentToggleFullscreen(){
  const card=document.querySelector('.document-viewer-card');
  if(!card) return;
  if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen();}
  else if(card.requestFullscreen){card.requestFullscreen();}
}
document.onfullscreenchange=()=>{if(document.getElementById('documentViewer'))documentFitToScreen();};
function documentToggleHelp(){const t=document.getElementById('documentHelpTip');if(t)t.classList.toggle('hidden');}
function documentDistance(t1,t2){
  const dx=t1.clientX-t2.clientX, dy=t1.clientY-t2.clientY;
  return Math.sqrt(dx*dx+dy*dy);
}
function documentCenter(t1,t2){return {x:(t1.clientX+t2.clientX)/2,y:(t1.clientY+t2.clientY)/2};}
function setupDocumentInteractions(wrap){
  wrap.addEventListener('pointerdown',(e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    documentPointerId=e.pointerId; wrap.setPointerCapture?.(e.pointerId);
    documentDragging=true; documentMoved=false;
    documentDownX=e.clientX; documentDownY=e.clientY;
    documentStartPanX=documentPanX; documentStartPanY=documentPanY;
    wrap.classList.add('dragging');
  });
  wrap.addEventListener('pointermove',(e)=>{
    if(e.pointerId!==documentPointerId || !documentDragging) return;
    const dx=e.clientX-documentDownX, dy=e.clientY-documentDownY;
    if(Math.abs(dx)>4 || Math.abs(dy)>4) documentMoved=true;
    documentPanX=documentStartPanX+dx; documentPanY=documentStartPanY+dy;
    updateDocumentTransform();
  });
  wrap.addEventListener('pointerup',(e)=>{
    if(e.pointerId!==documentPointerId) return;
    const wasMoved=documentMoved;
    documentDragging=false; documentPointerId=null; wrap.classList.remove('dragging');
    if(!wasMoved) documentZoomAt(documentScale*1.35,e.clientX,e.clientY);
  });
  wrap.addEventListener('pointercancel',()=>{documentDragging=false;documentPointerId=null;wrap.classList.remove('dragging');});
  wrap.addEventListener('wheel',(e)=>{e.preventDefault();documentZoomAt(documentScale*(e.deltaY<0?1.12:1/1.12),e.clientX,e.clientY);},{passive:false});
  wrap.addEventListener('touchstart',(e)=>{
    if(e.touches.length===2){
      documentDragging=false;
      documentLastTouchDistance=documentDistance(e.touches[0],e.touches[1]);
      documentLastTouchCenter=documentCenter(e.touches[0],e.touches[1]);
    }
  },{passive:false});
  wrap.addEventListener('touchmove',(e)=>{
    if(e.touches.length!==2 || !documentLastTouchDistance) return;
    e.preventDefault();
    const d=documentDistance(e.touches[0],e.touches[1]), c=documentCenter(e.touches[0],e.touches[1]);
    documentZoomAt(documentScale*(d/documentLastTouchDistance),c.x,c.y);
    documentPanX+=c.x-documentLastTouchCenter.x; documentPanY+=c.y-documentLastTouchCenter.y;
    documentLastTouchDistance=d; documentLastTouchCenter=c; updateDocumentTransform();
  },{passive:false});
  wrap.addEventListener('touchend',()=>{documentLastTouchDistance=null;documentLastTouchCenter=null;});
}
window.addEventListener('resize',()=>{if(document.getElementById('documentViewer')) documentFitToScreen();});

function attachEvents(){
 document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentTab=b.dataset.tab;render();});
 const s=document.getElementById('searchAct'),fs=document.getElementById('filterStrat'),fst=document.getElementById('filterStatus'),fo=document.getElementById('filterOwner');[s,fs,fst,fo].forEach(el=>{if(el)el.oninput=el.onchange=filterActions;});
 const ss=document.getElementById('searchStrat');if(ss)ss.oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.editor-card.strategy-card').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q)?'block':'none');};
}
function filterActions(){const q=(document.getElementById('searchAct').value||'').toLowerCase(),strat=document.getElementById('filterStrat').value,status=document.getElementById('filterStatus').value,owner=(document.getElementById('filterOwner').value||'').toLowerCase();document.querySelectorAll('#actionsList .action-item').forEach(el=>el.style.display=(!q||el.dataset.search.includes(q))&&(!strat||el.dataset.strategy===strat)&&(!status||el.dataset.status===status)&&(!owner||el.dataset.owner.includes(owner))?'flex':'none');}

function openModal(htmlContent){document.getElementById('modalBody').innerHTML='<div class="modal-brand">دبیرخانه شورای عالی انقلاب فرهنگی – معاونت فناوری و اقتصاد دانش‌بنیان</div>'+htmlContent;document.getElementById('modal').classList.add('active');}
function closeModal(){document.getElementById('modal').classList.remove('active');}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};

function editGoal(id){const g=DATA.goals.find(x=>x.id===Number(id));openModal(`<h2>ویرایش هدف ${g.id}</h2><div class="form-group"><label>عنوان هدف</label><input id="gTitle" value="${esc(g.title)}"></div><div class="form-row"><div class="form-group"><label>وزن</label><input type="number" id="gWeight" value="${g.weight}" min="0" step="0.1"></div><div class="form-group"><label>درصد تحقق</label><input type="number" id="gAch" value="${isMeasurableGoal(g)?g.achievement:''}" min="0" max="100" step="0.1"></div></div><div class="form-group"><label><input type="checkbox" id="gNotMeasurable" ${!isMeasurableGoal(g)?'checked':''}> این هدف قابل محاسبه نیست</label></div><div class="form-group"><label>توضیحات</label><textarea id="gDesc">${esc(g.description)}</textarea></div><div class="form-group"><label>یادداشت</label><textarea id="gNotes">${esc(g.notes||'')}</textarea></div><button class="btn btn-primary" onclick="saveGoal(${g.id})">💾 ذخیره</button>`);}
function saveGoal(id){const g=DATA.goals.find(x=>x.id===Number(id));g.title=document.getElementById('gTitle').value.trim();g.weight=Math.max(0,Number(document.getElementById('gWeight').value)||0);const n=document.getElementById('gNotMeasurable').checked,raw=document.getElementById('gAch').value;g.isMeasurable=!n;g.achievement=n||raw===''?null:clampPercent(raw);g.description=document.getElementById('gDesc').value;g.notes=document.getElementById('gNotes').value;closeModal();markUnsaved();render();}
function addGoal(){const id=nextId(DATA.goals);DATA.goals.push({id,title:'هدف جدید',weight:1,achievement:0,description:'',notes:''});editGoal(id);}
function deleteGoal(id){if(!confirm('هدف حذف شود؟'))return;DATA.goals=DATA.goals.filter(x=>x.id!==Number(id));markUnsaved();render();}

function strategyForm(s){return `<h2>${s?'ویرایش':'افزودن'} راهبرد</h2><div class="form-group"><label>عنوان راهبرد</label><input id="sTitle" value="${esc(s?.title||'')}"></div><div class="form-group"><label>توضیحات راهبرد</label><textarea id="sDesc">${esc(s?.description||'')}</textarea></div><div class="form-group"><label>اهداف مرتبط (شناسه‌ها با ویرگول)</label><input id="sGoals" value="${esc((s?.goalIds||[]).join(','))}" placeholder="مثلاً 1,3"></div><div class="small-help">برای اتصال راهبرد به اهداف، شناسه‌های اهداف را وارد کنید.</div><button class="btn btn-primary" onclick="${s?'saveStrategy('+s.id+')':'saveNewStrategy()'}">💾 ذخیره</button>`;}
function editStrategy(id){openModal(strategyForm(getStrategy(id)));}
function addStrategy(){openModal(strategyForm(null));}
function saveStrategy(id){const s=getStrategy(id);s.title=document.getElementById('sTitle').value.trim()||'راهبرد بدون عنوان';s.description=document.getElementById('sDesc').value;s.goalIds=document.getElementById('sGoals').value.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);closeModal();markUnsaved();render();}
function saveNewStrategy(){const id=nextId(DATA.strategies);DATA.strategies.push({id,title:'',goalIds:[],description:''});saveStrategy(id);}
function deleteStrategy(id){const sid=Number(id);const acts=getStrategyActions(sid);if(!confirm(`راهبرد و ${acts.length} اقدام وابسته حذف شوند؟`))return;DATA.strategies=DATA.strategies.filter(s=>s.id!==sid);DATA.actions=DATA.actions.filter(a=>a.strategyId!==sid);markUnsaved();render();}

function actionForm(a){
 const status=a?STATUS_BY_KEY[classifyAchievement(a.achievement)]:STATUS_BY_KEY.neglected;
 return `<h2>${a?'ویرایش':'افزودن'} اقدام${a?' '+a.id:''}</h2><div class="form-group"><label>عنوان اقدام</label><input id="aTitle" value="${esc(a?.title||'')}"></div><div class="form-group"><label>عنوان کوتاه (نمایش در نقشه درختی)</label><input id="aShortTitle" value="${esc(a?.shortTitle||'')}" placeholder="مثلاً بانک خون بندناف"></div><div class="form-row"><div class="form-group"><label>راهبرد</label><select id="aStrat">${DATA.strategies.map(s=>`<option value="${s.id}" ${a&&s.id===a.strategyId?'selected':''}>${esc(s.title)}</option>`).join('')}</select></div><div class="form-group"><label>درصد تحقق</label><input type="number" id="aAch" value="${a?clampPercent(a.achievement):0}" min="0" max="100" step="0.1" oninput="previewActionCategory()"></div></div><div id="aCategoryPreview" class="form-group"><label>دستهٔ خودکار</label><input class="readonly-field" id="aCat" readonly value="${status.label}"><div class="small-help">قواعد: بالای ۹۰٪ تکمیل‌شده | ۷۰ تا ۹۰٪ دستاورد عینی | ۵۰ تا کمتر از ۷۰٪ خروجی اولیه | ۱۰ تا کمتر از ۵۰٪ فعالیت اولیه | زیر ۱۰٪ مغفول</div></div><div class="form-row"><div class="form-group"><label>دستگاه مسئول</label><input id="aOwner" value="${esc(a?.owner||'')}"></div><div class="form-group"><label>وزن اقدام در محاسبه راهبرد</label><input type="number" id="aWeight" value="${a?.weight||1}" min="0" step="0.1"></div></div><div class="form-group"><label>دستگاه‌های همکار</label><input id="aCollaborators" value="${esc(a?.collaborators||'')}"></div><div class="form-group"><label>توضیحات</label><textarea id="aDesc">${esc(a?.description||'')}</textarea></div><div class="form-group"><label>یادداشت / چالش</label><textarea id="aNotes">${esc(a?.notes||'')}</textarea></div><button class="btn btn-primary" onclick="${a?'saveAction('+a.id+')':'saveNewAction()'}">💾 ذخیره</button>`;
}
function previewActionCategory(){const el=document.getElementById('aCat');if(el)el.value=STATUS_BY_KEY[classifyAchievement(document.getElementById('aAch').value)].label;}
function editAction(id){openModal(actionForm(getAction(id)));}
function addAction(strategyId){if(!DATA.strategies.length){alert('ابتدا حداقل یک راهبرد ایجاد کنید.');return;}openModal(actionForm({strategyId:strategyId||DATA.strategies[0].id,achievement:0,weight:1}));}
function saveAction(id){const a=getAction(id);a.title=document.getElementById('aTitle').value.trim()||'اقدام بدون عنوان';a.shortTitle=document.getElementById('aShortTitle').value.trim();a.strategyId=Number(document.getElementById('aStrat').value);a.achievement=clampPercent(document.getElementById('aAch').value);syncActionStatus(a);a.owner=document.getElementById('aOwner').value.trim();a.collaborators=document.getElementById('aCollaborators').value.trim();a.weight=Number(document.getElementById('aWeight').value)||1;a.description=document.getElementById('aDesc').value;a.notes=document.getElementById('aNotes').value;closeModal();markUnsaved();render();}
function saveNewAction(){const a={id:nextId(DATA.actions),title:document.getElementById('aTitle').value.trim()||'اقدام بدون عنوان',shortTitle:document.getElementById('aShortTitle').value.trim(),strategyId:Number(document.getElementById('aStrat').value),owner:document.getElementById('aOwner').value.trim(),collaborators:document.getElementById('aCollaborators').value.trim(),achievement:clampPercent(document.getElementById('aAch').value),weight:Number(document.getElementById('aWeight').value)||1,description:document.getElementById('aDesc').value,notes:document.getElementById('aNotes').value};syncActionStatus(a);DATA.actions.push(a);closeModal();markUnsaved();render();}
function deleteAction(id){if(!confirm('این اقدام حذف شود؟'))return;DATA.actions=DATA.actions.filter(a=>a.id!==Number(id));markUnsaved();render();}

function challengeForm(c){return `<h2>${c?'ویرایش':'افزودن'} چالش</h2><div class="form-group"><label>عنوان چالش</label><input id="cTitle" value="${esc(c?.title||'')}"></div><div class="form-group"><label>شرح چالش</label><textarea id="cDesc">${esc(c?.description||'')}</textarea></div><div class="form-group"><label>پیشنهاد</label><textarea id="cSug">${esc(c?.suggestion||'')}</textarea></div><button class="btn btn-primary" onclick="${c?'saveChallenge('+c.id+')':'saveNewChallenge()'}">💾 ذخیره</button>`;}
function editChallenge(id){openModal(challengeForm(getChallenge(id)));}
function addChallenge(){openModal(challengeForm(null));}
function saveChallenge(id){const c=getChallenge(id);c.title=document.getElementById('cTitle').value.trim();c.description=document.getElementById('cDesc').value;c.suggestion=document.getElementById('cSug').value;closeModal();markUnsaved();render();}
function saveNewChallenge(){DATA.challenges.push({id:nextId(DATA.challenges),title:document.getElementById('cTitle').value.trim(),description:document.getElementById('cDesc').value,suggestion:document.getElementById('cSug').value});closeModal();markUnsaved();render();}
function deleteChallenge(id){if(!confirm('این چالش حذف شود؟'))return;DATA.challenges=DATA.challenges.filter(c=>c.id!==Number(id));markUnsaved();render();}

async function boot(){
  try{
    DATA=await loadDataFile();
  }catch(err){
    console.error(err);
    document.getElementById('app').innerHTML='<div class="card"><div class="document-error"><b>خطا در بارگذاری data.json</b><br><br>فایل <b>data.json</b> باید دقیقاً در همان پوشه‌ای باشد که فایل HTML قرار دارد.<br>اگر فایل را مستقیم (دابل‌کلیک) باز کرده‌اید و این خطا را می‌بینید، مرورگر جلوی خواندن فایل محلی را گرفته است؛ یک سرور محلی اجرا کنید، مثلاً با دستور <b>python -m http.server</b> در همین پوشه و آدرس <b>http://localhost:8000</b> را باز کنید.</div></div>';
    return;
  }
  syncAllStatuses();
  render();
}
boot();
